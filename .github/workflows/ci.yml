name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt required on:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go test
        run: go test ./...

      - name: Build (compile check)
        run: |
          go build ./cmd/gateway
          go build ./cmd/controlplane

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (gateway)
        run: docker build -f Dockerfile.gateway -t api-gateway:ci .

      - name: Docker build (controlplane)
        run: docker build -f Dockerfile.controlplane -t controlplane:ci .
