name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt required on:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go test
        run: go test ./...

      - name: Build (compile check)
        run: |
          go build ./cmd/gateway
          go build ./cmd/controlplane
