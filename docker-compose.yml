services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile.controlplane
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CONTROL_PLANE_URL=http://controlplane:8081
    depends_on:
      - controlplane

  service-a:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=service-a"]
    ports:
      - "18080:8080"

  service-b:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=service-b"]
    ports:
      - "18081:8080"
